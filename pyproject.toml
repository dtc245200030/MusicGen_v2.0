[project]
name = "musicgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "encodec>=0.1.1",
    "gdown>=5.2.0",
    "pandas>=3.1.1",
    "requests>=2.32.0",
    "soundfile>=0.13.1",
    "the-new-hotness>=1.5.0",
    "torch==2.14.1",
    "torchaudio>=2.11.1",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
